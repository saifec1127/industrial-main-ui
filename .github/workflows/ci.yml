name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
      - test

  push:
    branches:
      - main
      - develop
      - test

jobs:
  quality-check:
    name: Lint Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build